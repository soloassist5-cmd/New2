# Render Blueprint: дашборд -> Blueprints -> New Blueprint Instance -> репозиторий.
# Секреты (sync: false) задаются один раз в UI и не попадают в git.
# WEBHOOK_URL указывать не нужно: подхватится RENDER_EXTERNAL_URL, и бот сам
# переключится с long polling на вебхук.
services:
  - type: web
    name: tg-guard
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      # Обязательный: токен из @BotFather.
      - key: BOT_TOKEN
        sync: false
      # Необязательные — только если нужен ещё и режим юзербота.
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: SESSION
        sync: false
      - key: OWNER_ID
        sync: false
      - key: PREFIX
        value: "."
      - key: MUTE_ANIM
        value: type
      - key: ANIM_DELAY
        value: "0.4"
      # Диск на free-плане эфемерный: бот присылает копию базы себе в чат,
      # обратная пересылка файла её восстанавливает.
      - key: BACKUP_EVERY_MIN
        value: "30"
      - key: RESTORE_ON_START
        value: "1"

# Запасной вариант: Fly.io. Секреты — через `fly secrets set`, не через этот файл.
# В GitHub: Settings -> Secrets -> Actions -> FLY_API_TOKEN.
name: Deploy · Fly.io

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

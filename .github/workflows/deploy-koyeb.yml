# Автодеплой на Koyeb при пуше в main.
# Разово в дашборде Koyeb: Secrets -> создать api-id, api-hash, tg-session,
# bot-token, log-chat.
# В GitHub: Settings -> Secrets -> Actions -> KOYEB_TOKEN.
name: Deploy · Koyeb

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-koyeb
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: koyeb/action-git-deploy@v1
        with:
          api-token: ${{ secrets.KOYEB_TOKEN }}
          app-name: tg-guard
          service-name: guard
          git-builder: docker
          git-docker-dockerfile: Dockerfile
          service-instance-type: free
          service-regions: fra
          service-ports: "8080:http"
          service-routes: "/:8080"
          service-checks: "8080:http:/health"
          # @имя — ссылка на секрет Koyeb, значения в репозиторий не попадают
          service-env: >-
            PORT=8080,
            API_ID=@api-id,
            API_HASH=@api-hash,
            SESSION=@tg-session,
            BOT_TOKEN=@bot-token,
            LOG_CHAT=@log-chat,
            BACKUP_EVERY_MIN=30,
            RESTORE_ON_START=1

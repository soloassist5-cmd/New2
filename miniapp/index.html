<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guard</title>
<link rel="icon" href="/app/logo.svg" type="image/svg+xml">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Небо и золото. Своя палитра, а не тема Telegram: у бота должно быть лицо,
     которое узнаётся. Светлая и тёмная версии — обе фирменные.

     color-mix и прочую свежатину не используем нарочно: WebView в Telegram на
     Android бывает заметно старее браузера, и незакрашенный фон там выглядит
     как поломка. Все полупрозрачные цвета — обычной rgba. */
  :root {
    --sky-50:  #eff8ff;
    --sky-100: #daeeff;
    --sky-300: #8ccdf5;
    --sky-500: #2e8fd8;
    --sky-700: #1b5f96;
    --gold-300: #ffe08a;
    --gold-500: #e8b33c;
    --gold-600: #c9922a;

    --bg: var(--sky-50);
    --bg-deep: #dfeeff;
    --card: #ffffff;
    --line: rgba(28, 78, 122, .13);
    --text: #0e2537;
    --hint: #5d7c94;
    --accent: var(--sky-500);
    --accent-soft: rgba(46, 143, 216, .12);
    --gold: var(--gold-600);
    --gold-soft: rgba(232, 179, 60, .18);
    --danger: #d2483c;
    --danger-soft: rgba(210, 72, 60, .12);
    --ok: #2f9e5f;
    --ok-soft: rgba(47, 158, 95, .14);
    --shadow: 0 1px 2px rgba(16, 62, 99, .07), 0 8px 24px rgba(16, 62, 99, .07);
    --radius: 16px;
  }
  body.dark {
    --bg: #0a1826;
    --bg-deep: #06111c;
    --card: #12283d;
    --line: rgba(150, 200, 240, .14);
    --text: #e9f3fb;
    --hint: #8aa9c2;
    --accent: #5cb3f0;
    --accent-soft: rgba(92, 179, 240, .16);
    --gold: var(--gold-500);
    --gold-soft: rgba(232, 179, 60, .16);
    --danger: #f0776a;
    --danger-soft: rgba(240, 119, 106, .16);
    --ok: #5ecb8b;
    --ok-soft: rgba(94, 203, 139, .16);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .28);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 0 14px 36px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    /* Рассвет: небо сверху, тёплый отблеск у горизонта. */
    background-image:
      radial-gradient(120% 60% at 50% -10%, var(--bg-deep) 0%, var(--bg) 62%);
    background-attachment: fixed;
  }
  .muted { color: var(--hint); }
  .small { font-size: 13px; }

  /* ------------------------------------------------------------- шапка -- */
  header { display: flex; align-items: center; gap: 11px; padding: 18px 2px 14px; }
  header img { width: 38px; height: 38px; flex: none;
               filter: drop-shadow(0 2px 6px rgba(30, 99, 174, .28)); }
  header h1 { margin: 0; font-size: 20px; letter-spacing: -.2px; }
  header .sub { font-size: 12.5px; color: var(--hint); margin-top: 1px; }

  /* ------------------------------------------------------------ карточки - */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 15px;
    margin-bottom: 11px;
  }
  .row { display: flex; align-items: center; gap: 11px; }
  .grow { flex: 1; min-width: 0; }

  /* Дежурство: когда режим включён, карточка светится золотом — состояние
     должно быть видно с порога, а не читаться в подписи. */
  .duty { position: relative; overflow: hidden; }
  .duty.on {
    border-color: rgba(232, 179, 60, .55);
    background-image: linear-gradient(135deg, var(--gold-soft), transparent 62%);
  }
  .duty h2 { margin: 0; font-size: 16px; }

  .switch { position: relative; width: 52px; height: 30px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .track {
    position: absolute; inset: 0; border-radius: 999px;
    background: rgba(120, 150, 175, .35);
    transition: background .2s ease; pointer-events: none;
  }
  .track::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 24px; height: 24px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
    transition: transform .2s ease;
  }
  .switch input:checked + .track {
    background: linear-gradient(135deg, var(--gold-300), var(--gold-500));
  }
  .switch input:checked + .track::after { transform: translateX(22px); }
  .switch input:disabled + .track { opacity: .55; }

  /* ---------------------------------------------------------- статистика - */
  .stats { display: grid; gap: 9px; grid-template-columns: repeat(4, 1fr);
           margin-bottom: 11px; }
  .stat {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 13px; padding: 11px 6px; text-align: center;
    box-shadow: var(--shadow);
  }
  .stat b { display: block; font-size: 19px; color: var(--gold); letter-spacing: -.4px; }
  .stat span { display: block; font-size: 11px; color: var(--hint); margin-top: 2px; }

  /* --------------------------------------------------------------- табы -- */
  /* Сеткой, а не лентой с прокруткой: лента обрезалась по краям экрана и
     выглядела рвано, а половину вкладок приходилось искать пальцем. */
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px;
          margin: 4px 0 12px; }
  .tab {
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); color: var(--text);
    padding: 9px 4px 8px; font-size: 12px; font-family: inherit;
    cursor: pointer; text-align: center; box-shadow: var(--shadow);
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .tab i { display: block; font-style: normal; font-size: 16px; margin-bottom: 3px; }
  .tab[aria-selected="true"] {
    background: linear-gradient(135deg, var(--gold-300), var(--gold-500));
    border-color: var(--gold-600);
    color: #3a2a05;
    font-weight: 600;
  }

  /* --------------------------------------------------------------- списки  */
  .item { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .item:first-child { padding-top: 0; }
  .item:last-child { border-bottom: 0; padding-bottom: 0; }
  .item .head { display: flex; align-items: baseline; gap: 8px; }
  .item .who { font-weight: 600; }
  .item .when { margin-left: auto; font-size: 11.5px; color: var(--hint);
                flex: none; }
  .item .body { margin-top: 4px; overflow-wrap: anywhere; white-space: pre-wrap; }

  button.act {
    border: 1px solid transparent; border-radius: 11px; padding: 9px 14px;
    font-size: 13.5px; font-family: inherit; cursor: pointer;
    background: var(--accent); color: #fff; white-space: nowrap;
  }
  button.act.ghost { background: var(--accent-soft); color: var(--accent);
                     border-color: var(--line); }
  button.act.danger { background: var(--danger-soft); color: var(--danger);
                      border-color: rgba(210, 72, 60, .3); }
  button.act.wipe { background: var(--danger); color: #fff; width: 100%;
                    margin-top: 12px; }
  button.act[disabled] { opacity: .5; cursor: default; }

  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px;
          font-size: 12px; background: var(--accent-soft); color: var(--accent); }
  .pill.on { background: var(--ok-soft); color: var(--ok); }
  .pill.off { background: var(--danger-soft); color: var(--danger); }

  .empty { color: var(--hint); text-align: center; padding: 26px 8px; }
  .empty .big { display: block; font-size: 26px; margin-bottom: 6px; opacity: .75; }
  .hidden { display: none !important; }

  @keyframes pulse { 0%, 100% { opacity: .45 } 50% { opacity: .9 } }
  .loading { animation: pulse 1.1s ease-in-out infinite; }
</style>
</head>
<body>

<header>
  <img src="/app/logo.svg" alt="">
  <div class="grow">
    <h1>Guard</h1>
    <div class="sub">страж личных чатов</div>
  </div>
  <span id="link" class="pill"></span>
</header>

<div id="boot" class="card empty loading">Загружаю…</div>

<main id="app" class="hidden">
  <div class="card duty" id="duty">
    <div class="row">
      <div class="grow">
        <h2>🌙 Не беспокоить</h2>
        <div class="small muted" id="dndHint"></div>
      </div>
      <label class="switch">
        <input type="checkbox" id="dnd" aria-label="Не беспокоить">
        <span class="track"></span>
      </label>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="card" id="panel"></div>
</main>

<script>
const tg = window.Telegram?.WebApp;
const $ = (id) => document.getElementById(id);
let snap = null;

tg?.ready();
tg?.expand();

// Тему берём у Telegram, а цвета — свои: иначе приложение выглядит белым
// пятном в тёмном мессенджере.
function applyScheme() {
  const dark = tg?.colorScheme
    ? tg.colorScheme === "dark"
    : window.matchMedia?.("(prefers-color-scheme: dark)").matches;
  document.body.classList.toggle("dark", !!dark);
  const paint = getComputedStyle(document.body).backgroundColor;
  try { tg?.setHeaderColor?.(dark ? "#0a1826" : "#eff8ff"); } catch (e) { /* старый клиент */ }
  try { tg?.setBackgroundColor?.(paint); } catch (e) { /* старый клиент */ }
}
applyScheme();
tg?.onEvent?.("themeChanged", applyScheme);

async function api(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Init-Data": tg?.initData || "" },
    body: JSON.stringify(body || {}),
  });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.status);
  return res.json();
}

const buzz = (kind) => tg?.HapticFeedback?.notificationOccurred?.(kind);

function when(unix) {
  if (!unix) return "";
  const d = new Date(unix * 1000);
  const p = (n) => String(n).padStart(2, "0");
  return `${p(d.getDate())}.${p(d.getMonth() + 1)} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function node(tag, cls, text) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text != null) el.textContent = text;
  return el;
}

function nothing(icon, text) {
  const box = node("div", "empty");
  box.append(node("span", "big", icon), document.createTextNode(text));
  return box;
}

function item(who, stamp, body) {
  const box = node("div", "item");
  const head = node("div", "head");
  head.append(node("span", "who", who || "—"), node("span", "when", when(stamp)));
  box.append(head, node("div", "body", body || "—"));
  return box;
}

// ------------------------------------------------------------------ экран --

function paintHead() {
  $("dnd").checked = snap.dnd;
  $("duty").classList.toggle("on", snap.dnd);
  $("dndHint").textContent = snap.dnd
    ? "входящие удаляются сразу, отправитель получает ответ"
    : "сообщения доходят как обычно";

  const link = $("link");
  link.className = "pill " + (snap.connected ? "on" : "off");
  link.textContent = snap.connected ? "на связи" : "не подключён";

  // «В памяти» намеренно нет: это кэш, и он живёт во вкладке «Чистка».
  const labels = [
    ["deleted", "удалённых"], ["intercepted", "перехвачено"],
    ["edits", "правок"], ["mutes", "мутов"],
  ];
  $("stats").replaceChildren(...labels.map(([key, name]) => {
    const box = node("div", "stat");
    box.append(node("b", null, snap.stats[key] ?? 0), node("span", null, name));
    return box;
  }));
}

const TABS = [
  ["deleted", "🗑", "Удалённые"],
  ["intercepted", "🔇", "Перехват"],
  ["urgent", "🚨", "Вызовы"],
  ["mutes", "🔕", "Муты"],
  ["allowed", "✅", "Исключения"],
  ["clean", "🧹", "Чистка"],
];

let active = "deleted";

function paintTabs() {
  $("tabs").replaceChildren(...TABS.map(([key, icon, name]) => {
    const b = node("button", "tab");
    b.append(node("i", null, icon), document.createTextNode(name));
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(key === active));
    b.onclick = () => {
      if (key === active) return;
      active = key;
      tg?.HapticFeedback?.selectionChanged?.();
      paintTabs();
      paintPanel();
    };
    return b;
  }));
}

async function paintPanel() {
  const panel = $("panel");
  panel.replaceChildren(node("div", "empty loading", "Загружаю…"));
  try {
    if (active === "clean") return paintClean(panel);
    const rows = await api("/app/api/list", { what: active, limit: 30 });
    if (!rows.items.length) {
      panel.replaceChildren(nothing(EMPTY[active][0], EMPTY[active][1]));
      return;
    }
    panel.replaceChildren(...rows.items.map(render[active]));
  } catch (e) {
    panel.replaceChildren(nothing("⚠️", "Не вышло: " + e.message));
  }
}

const EMPTY = {
  deleted: ["🗑", "Никто ничего не удалял."],
  intercepted: ["🔇", "Перехватывать пока нечего."],
  urgent: ["🚨", "Срочных вызовов не было."],
  mutes: ["🔕", "Никто не замучен."],
  allowed: ["✅", "Белый список пуст — «не беспокоить» удаляет всех."],
};

function withButton(box, label, onClick) {
  const btn = node("button", "act ghost", label);
  btn.style.marginTop = "9px";
  btn.onclick = async () => {
    btn.disabled = true;
    try { await onClick(); buzz("success"); } catch (e) { buzz("error"); }
  };
  box.append(btn);
  return box;
}

const render = {
  deleted: (r) => item(r.user_name, r.deleted_at,
    r.text || (r.media_type ? `<${r.media_type}>` : "—")),
  intercepted: (r) => item(r.user_name, r.date,
    (r.reason === "dnd" ? "🌙 " : "🔇 ") +
    (r.text || (r.media_type ? `<${r.media_type}>` : "—"))),
  urgent: (r) => item(r.user_name, r.at, r.reason || "без пояснения"),
  mutes: (r) => withButton(
    item(String(r.user_id), r.created_at,
      (r.until ? "до " + when(r.until) : "бессрочно") +
      (r.reason ? " · " + r.reason : "")),
    "Снять мут",
    async () => {
      await api("/app/api/act", { action: "unmute", user_id: r.user_id,
                                  chat_id: r.chat_id });
      refresh();
    }),
  allowed: (r) => withButton(
    item(r.name || String(r.user_id), r.added_at, "id " + r.user_id),
    "Убрать из списка",
    async () => {
      await api("/app/api/act", { action: "deny", user_id: r.user_id });
      paintPanel();
    }),
};

function paintClean(panel) {
  const rows = snap.kinds
    .map((kind) => [kind, snap.counts[kind.key] || 0])
    .filter(([, total]) => total > 0);

  if (!rows.length) {
    panel.replaceChildren(nothing("✨", "Чисто. Ничего не накопилось."));
    return;
  }

  const blocks = rows.map(([kind, total]) => {
    const box = node("div", "item");
    const line = node("div", "row");
    const left = node("div", "grow");
    left.append(node("div", null, `${kind.icon} ${kind.name} — ${total}`),
                node("div", "small muted", kind.hint));
    const btn = node("button", "act danger", "Очистить");
    btn.onclick = () => wipe(kind, total, btn);
    line.append(left, btn);
    box.append(line);
    return box;
  });

  const total = rows.reduce((sum, [, n]) => sum + n, 0);
  const all = node("button", "act wipe", `🧨 Всё сразу — ${total}`);
  all.onclick = () => wipe({ key: "*", name: "всё сразу" }, total, all);
  panel.replaceChildren(...blocks, all);
}

function wipe(kind, total, btn) {
  const ask = `Удалить безвозвратно: ${kind.name} — ${total}?`;
  const run = async () => {
    btn.disabled = true;
    try {
      const res = await api("/app/api/act", { action: "clear", kind: kind.key });
      buzz("success");
      tg?.showAlert?.(`Удалено: ${res.removed}`);
      refresh();
    } catch (e) {
      btn.disabled = false;
      buzz("error");
    }
  };
  if (tg?.showConfirm) tg.showConfirm(ask, (yes) => { if (yes) run(); });
  else if (confirm(ask)) run();
}

// ------------------------------------------------------------- запуск -----

$("dnd").onchange = async (e) => {
  const on = e.target.checked;
  e.target.disabled = true;
  try {
    const res = await api("/app/api/act", { action: "dnd", on });
    snap.dnd = res.dnd;
    buzz("success");
  } catch (err) {
    e.target.checked = !on;
    buzz("error");
    tg?.showAlert?.("Не вышло: " + err.message);
  } finally {
    e.target.disabled = false;
    paintHead();
  }
};

async function refresh() {
  snap = await api("/app/api/state");
  paintHead();
  paintPanel();
}

(async () => {
  try {
    await refresh();
    paintTabs();
    $("boot").classList.add("hidden");
    $("app").classList.remove("hidden");
  } catch (e) {
    $("boot").classList.remove("loading");
    $("boot").replaceChildren(nothing("🔒", e.message === "denied"
      ? "Доступ к боту не открыт. Напишите ему /start."
      : "Не удалось загрузить: " + e.message));
  }
})();
</script>
</body>
</html>
